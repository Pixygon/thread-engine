[package]
name = "thread-rendezvous"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "A self-hostable reference P2P rendezvous for the Thread — introduces peers, relays WebRTC signaling blindly, never sees a pose (presence-topology-v0.1 §3.2)."

[[bin]]
name = "thread-rendezvous"
path = "src/main.rs"

[lib]
name = "thread_rendezvous"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The rendezvous certifies itself against the same wire checker anyone else would use.
thread-conformance = { path = "../thread-conformance" }
