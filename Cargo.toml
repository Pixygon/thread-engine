[workspace]
resolver = "2"
members = [
    "crates/thread-id",
    "crates/infinite-manifest",
    "crates/infinite-avatar",
    "crates/weft",
    "crates/chisel",
    "crates/loom",
    "crates/thread-relay",
    "crates/thread-rendezvous",
    "crates/thread-conformance",
    "crates/weft-pack",
    "crates/thread-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Pixygon <dev@pixygon.io>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Pixygon/thread-engine"

[workspace.dependencies]
chisel = { package = "thread-chisel", path = "crates/chisel", version = "0.1.0" }
glam = { version = "0.29", features = ["serde"] }
gltf = "1.4"
image = "0.25"
infinite-avatar = { package = "thread-avatar", path = "crates/infinite-avatar", version = "0.1.0" }
infinite-manifest = { package = "thread-manifest", path = "crates/infinite-manifest", version = "0.1.0" }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thread-id = { package = "thread-structured-id", path = "crates/thread-id", version = "0.1.0" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
