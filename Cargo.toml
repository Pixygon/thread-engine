[workspace]
resolver = "2"
members = [
    "crates/thread-id",
    "crates/infinite-manifest",
    "crates/infinite-avatar",
    "crates/weft",
    "crates/chisel",
    "crates/loom",
    "crates/thread-relay",
    "crates/thread-rendezvous",
    "crates/thread-conformance",
    "crates/weft-pack",
    "crates/thread-cli",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
authors = ["Pixygon <dev@pixygon.io>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Pixygon/thread-engine"

[workspace.dependencies]
chisel = { package = "thread-chisel", path = "crates/chisel", version = "0.2.2" }
glam = { version = "0.29", features = ["serde"] }
gltf = "1.4"
image = "0.25"
infinite-avatar = { package = "thread-avatar", path = "crates/infinite-avatar", version = "0.2.2" }
infinite-manifest = { package = "thread-manifest", path = "crates/infinite-manifest", version = "0.2.2" }
# `default-features = false` is load-bearing: reqwest's default `default-tls`
# is native-tls, so adding `rustls-tls` alongside it stacked a second TLS
# implementation and dragged in openssl-sys, which then failed every
# cross-compiled build looking for an OpenSSL install for the target. `charset`
# and `http2` are defaults we do want, so they are named explicitly.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "blocking", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thread-id = { package = "thread-structured-id", path = "crates/thread-id", version = "0.2.2" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
